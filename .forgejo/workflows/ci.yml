# Checks every push and pull request: types, tests, and the four release binaries.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build the release binaries
        run: |
          bun run build:release
          ./dist/tycho-linux-$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/') version
